fidelity:
  divergences: >-
    The uniform real-frame statement uses the three compressed matrices in the
    exact Hardy objective. The curve theorem optimizes over all orthonormal endpoint
    families satisfying the fifth-power orthogonality constraint. The earlier conversion from six binary measurements
    and five zero probabilities is invoked in the written proof. The semidefinite
    formulation and the strict seven-percent slice certificate are accompanying
    mathematical and computational results. The full five-level ceiling is open.
