version: v0.4
project:
  name: Real Measurements and Sharp Pairing in the Five-Level Hardy Ladder
  description: >-
    For each complex terminal two-plane in dimension five, two real orthonormal
    terminal frames preserve all five coordinate weights and bracket the
    compressed two-step Hardy success for every positive Schmidt spectrum.
    The same two frames work throughout this family of spectra. For spectra
    proportional to (s,2,3,4,5) with 0<s≤2, the exact maximum at unrestricted
    endpoint ranks is attained by the real pairs (2,4) and (3,5).
  authors: [Stephanie Alexander]
  responsible_maintainers: [Stephanie Alexander]
  license: MIT
